# Per-user Howdy overrides (surface-howdy)
# Values here override /usr/lib/security/howdy/config.ini for face checks
# you perform (sudo, lock screen). Anything left out falls back to the
# system config.

[video]
# Low-light rooms: raise so dim frames are not discarded.
# Range 1-100: percentage of near-black pixels that causes a frame skip.
dark_threshold = 90

# Matching strictness (lower = stricter). Default 3.5
# certainty = 3.5

# Seconds to scan before falling back to the password. Default 6
# timeout = 6
