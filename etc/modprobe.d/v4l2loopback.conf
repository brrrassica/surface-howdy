# Howdy needs one virtual capture device:
#  - video_nr=20            -> /dev/video20 (referenced by howdy config device_path)
#  - exclusive_caps=0       -> howdy/OpenCV needs a plain V4L2 capture device
#  - output_formats mspace:2 -> media-space swap NV12->NV21 on the capture side,
#                              which applies the 180-degree rotation required by
#                              the upside-down mounted front sensor (ov5693).
options v4l2loopback devices=1 video_nr=20 card_label="HowdyLoopback" exclusive_caps=0 output_formats="mspace:2"
